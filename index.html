<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Екран Суми</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0d12; color: #fff; font-family: -apple-system, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; padding: 18px; }
.container { width: 100%; height: 100%; display: table; table-layout: fixed; }
.row-top { display: table-row; height: 42%; }
.row-bottom { display: table-row; height: 58%; }
.cell { display: table-cell; vertical-align: middle; padding: 10px; }
.card { background: #161b26; border-radius: 18px; padding: 20px; height: 100%; border: 1px solid #262e40; overflow: hidden; }
.clock-time { font-size: 112px; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; -webkit-font-variant-numeric: tabular-nums; }
.clock-seconds { font-size: 40px; color: #6c7a9c; font-weight: 400; display: inline-block; width: 65px; }
.clock-date { font-size: 26px; color: #9ba8c7; margin-top: 14px; }
.title { font-size: 18px; color: #9ba8c7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
iframe { width: 100%; height: 85%; border: none; border-radius: 10px; background: #161b26; }
</style>
</head>
<body>
<div class="container">
  <div class="row-top">
    <div class="cell" style="width:58%">
      <div class="card">
        <div class="clock-time"><span id="hm">00:00</span><span id="sec" class="clock-seconds">:00</span></div>
        <div id="date" class="clock-date"></div>
      </div>
    </div>
    <div class="cell" style="width:42%">
      <div class="card">
        <div class="title">Курси валют • Україна</div>
        <iframe src="https://minfin.com.ua"></iframe>
      </div>
    </div>
  </div>
  <div class="row-bottom">
    <div class="cell" style="width:100%" colspan="2">
      <div class="card">
        <div class="title">Погода в Сумах та прогноз</div>
        <iframe src="https://meteoprog.ua"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
var duStr = "Неділя,Понеділок,Вівторок,Середа,Четвер,П'ятниця,Субота";
var muStr = "січня,лютого,березня,квітня,травня,червня,липня,серпня,вересня,жовтня,листопада,грудня";
var lm = -1;

function getItem(arr, idx) { return arr.slice(idx, idx + 1).pop(); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }

function tick() {
  var d = new Date();
  var m = d.getMinutes();
  document.getElementById("sec").textContent = ":" + pad(d.getSeconds());
  if (m !== lm) {
    lm = m;
    document.getElementById("hm").textContent = pad(d.getHours()) + ":" + pad(m);
    var dayName = getItem(duStr.split(","), d.getDay());
    var monthName = getItem(muStr.split(","), d.getMonth());
    document.getElementById("date").textContent = dayName + ", " + d.getDate() + " " + monthName + " " + d.getFullYear();
  }
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
