<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Екран Суми</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0d12; color: #fff; font-family: -apple-system, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; padding: 20px; }
.container { width: 100%; height: 100%; display: table; table-layout: fixed; }
.row-top { display: table-row; height: 54%; }
.row-bottom { display: table-row; height: 46%; }
.cell { display: table-cell; vertical-align: middle; padding: 12px; }
.card { background: #161b26; border-radius: 18px; padding: 22px; height: 100%; border: 1px solid #262e40; }
.clock-time { font-size: 110px; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; -webkit-font-variant-numeric: tabular-nums; }
.clock-seconds { font-size: 40px; color: #6c7a9c; font-weight: 400; display: inline-block; width: 65px; }
.clock-date { font-size: 26px; color: #9ba8c7; margin-top: 15px; }
.weather-title { font-size: 20px; color: #9ba8c7; text-transform: uppercase; letter-spacing: 1px; }
.weather-now-box { margin-top: 15px; }
.weather-temp { font-size: 80px; font-weight: 700; color: #4da6ff; display: inline-block; vertical-align: middle; }
.weather-desc { display: inline-block; vertical-align: middle; margin-left: 15px; font-size: 24px; color: #e2e8f0; }
.weather-details { margin-top: 15px; font-size: 19px; color: #8b99b8; }
.forecast-table { width: 100%; height: 82%; margin-top: 10px; border-collapse: collapse; }
.forecast-day { text-align: center; border-right: 1px solid #262e40; padding: 8px; width: 25%; }
.forecast-day:last-child { border-right: none; }
.f-date { font-size: 20px; color: #9ba8c7; margin-bottom: 8px; }
.f-icon { font-size: 34px; margin: 6px 0; }
.f-temp { font-size: 24px; font-weight: 700; color: #fff; }
.currency-item { margin-top: 16px; padding-bottom: 14px; border-bottom: 1px solid #262e40; }
.currency-item:last-child { border-bottom: none; padding-bottom: 0; }
.curr-name { font-size: 24px; color: #9ba8c7; display: inline-block; width: 38%; vertical-align: middle; }
.curr-val-box { display: inline-block; width: 60%; text-align: right; vertical-align: middle; }
.curr-sell { font-size: 36px; font-weight: 700; color: #4ade80; }
.curr-note { font-size: 14px; color: #64748b; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="row-top">
    <div class="cell" style="width:58%">
      <div class="card">
        <div class="clock-time"><span id="hm">00:00</span><span id="sec" class="clock-seconds">:00</span></div>
        <div id="date" class="clock-date"></div>
      </div>
    </div>
    <div class="cell" style="width:42%">
      <div class="card">
        <div class="weather-title">Погода зараз • Суми</div>
        <div class="weather-now-box">
          <div id="w-temp" class="weather-temp">--°</div>
          <div id="w-desc" class="weather-desc">Оновлення...</div>
        </div>
        <div id="w-details" class="weather-details">Вітер: -- м/с</div>
      </div>
    </div>
  </div>
  <div class="row-bottom">
    <div class="cell" style="width:58%">
      <div class="card">
        <div class="weather-title">Прогноз на 4 дні</div>
        <table class="forecast-table">
          <tr>
            <td class="forecast-day"><div id="fd1" class="f-date">--.--</div><div id="fi1" class="f-icon">⛅</div><div id="ft1" class="f-temp">--°</div></td>
            <td class="forecast-day"><div id="fd2" class="f-date">--.--</div><div id="fi2" class="f-icon">⛅</div><div id="ft2" class="f-temp">--°</div></td>
            <td class="forecast-day"><div id="fd3" class="f-date">--.--</div><div id="fi3" class="f-icon">⛅</div><div id="ft3" class="f-temp">--°</div></td>
            <td class="forecast-day"><div id="fd4" class="f-date">--.--</div><div id="fi4" class="f-icon">⛅</div><div id="ft4" class="f-temp">--°</div></td>
          </tr>
        </table>
      </div>
    </div>
    <div class="cell" style="width:42%">
      <div class="card">
        <div class="weather-title">Курс валют • UAH</div>
        <div class="currency-item"><span class="curr-name">USD</span><div class="curr-val-box"><span id="usd-sell" class="curr-sell">--.-- ₴</span></div></div>
        <div class="currency-item"><span class="curr-name">EUR</span><div class="curr-val-box"><span id="eur-sell" class="curr-sell">--.-- ₴</span></div></div>
        <div id="curr-date" class="curr-note">Оновлення...</div>
      </div>
    </div>
  </div>
</div>

<script>
var duStr = "Неділя,Понеділок,Вівторок,Середа,Четвер,П'ятниця,Субота";
var dsStr = "Нд,Пн,Вт,Ср,Чт,Пт,Сб";
var muStr = "січня,лютого,березня,квітня,травня,червня,липня,серпня,вересня,жовтня,листопада,грудня";
var lm = -1;

function getItem(arr, idx) {
  return arr.slice(idx, idx + 1).pop();
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }

function tick() {
  var d = new Date();
  var m = d.getMinutes();
  document.getElementById("sec").textContent = ":" + pad(d.getSeconds());
  if (m !== lm) {
    lm = m;
    document.getElementById("hm").textContent = pad(d.getHours()) + ":" + pad(m);
    var dayName = getItem(duStr.split(","), d.getDay());
    var monthName = getItem(muStr.split(","), d.getMonth());
    document.getElementById("date").textContent = dayName + ", " + d.getDate() + " " + monthName + " " + d.getFullYear();
  }
}
setInterval(tick, 1000);
tick();

function metIcon(sym) {
  if (!sym) return "⛅";
  if (sym.indexOf("clearsky") !== -1) return "☀️";
  if (sym.indexOf("fair") !== -1 || sym.indexOf("partlycloudy") !== -1) return "⛅";
  if (sym.indexOf("cloudy") !== -1) return "☁️";
  if (sym.indexOf("fog") !== -1) return "🌫️";
  if (sym.indexOf("thunder") !== -1) return "⛈️";
  if (sym.indexOf("snow") !== -1 || sym.indexOf("sleet") !== -1) return "❄️";
  if (sym.indexOf("rain") !== -1) return "🌧️";
  return "⛅";
}

function metText(sym) {
  if (!sym) return "Хмарно";
  if (sym.indexOf("clearsky") !== -1) return "Ясно";
  if (sym.indexOf("fair") !== -1 || sym.indexOf("partlycloudy") !== -1) return "Мінливо";
  if (sym.indexOf("cloudy") !== -1) return "Хмарно";
  if (sym.indexOf("fog") !== -1) return "Туман";
  if (sym.indexOf("thunder") !== -1) return "Гроза";
  if (sym.indexOf("snow") !== -1 || sym.indexOf("sleet") !== -1) return "Сніг";
  if (sym.indexOf("rain") !== -1) return "Дощ";
  return "Хмарно";
}

function loadWeather() {
  var x = new XMLHttpRequest();
  x.open("GET", "https://met.no", true);
  x.onload = function() {
    try {
      var data = JSON.parse(x.responseText);
      var list = data.properties.timeseries;
      var nowItem = getItem(list, 0);
      var det = nowItem.data.instant.details;
      var t = Math.round(det.air_temperature);
      var sym = nowItem.data.next_1_hours ? nowItem.data.next_1_hours.summary.symbol_code : "cloudy";
      document.getElementById("w-temp").textContent = (t > 0 ? "+" : "") + t + "°";
      document.getElementById("w-desc").textContent = metIcon(sym) + " " + metText(sym);
      document.getElementById("w-details").textContent = "Вітер: " + det.wind_speed.toFixed(1) + " м/с • Вологість: " + Math.round(det.relative_humidity) + "%";

      var dsArr = dsStr.split(",");
      var found = 0;
      var todayStr = new Date().toISOString().slice(0, 10);
      var usedDays = {};
      usedDays[todayStr] = true;

      for (var i = 1; i < list.length && found < 4; i++) {
        var item = getItem(list, i);
        var dStr = item.time.slice(0, 10);
        var hrStr = item.time.slice(11, 13);
        if (!usedDays[dStr] && (hrStr === "12" || hrStr === "11" || hrStr === "13")) {
          usedDays[dStr] = true;
          found++;
          var dt = new Date(Number(dStr.slice(0, 4)), Number(dStr.slice(5, 7)) - 1, Number(dStr.slice(8, 10)));
          var fTemp = Math.round(item.data.instant.details.air_temperature);
          var fSym = item.data.next_6_hours ? item.data.next_6_hours.summary.symbol_code : "cloudy";
          document.getElementById("fd" + found).textContent = getItem(dsArr, dt.getDay()) + ", " + pad(dt.getDate()) + "." + pad(dt.getMonth() + 1);
          document.getElementById("fi" + found).textContent = metIcon(fSym);
          document.getElementById("ft" + found).textContent = (fTemp > 0 ? "+" + fTemp : fTemp) + "°";
        }
      }
    } catch (e) {
      document.getElementById("w-desc").textContent = "Помилка даних";
    }
  };
  x.onerror = function() {
    document.getElementById("w-desc").textContent = "Помилка мережі";
  };
  x.send();
}

function loadRates() {
  var x1 = new XMLHttpRequest();
  x1.open("GET", "https://jsdelivr.net", true);
  x1.onload = function() {
    try {
      var d = JSON.parse(x1.responseText);
      document.getElementById("usd-sell").textContent = d.usd.uah.toFixed(2) + " ₴";
      document.getElementById("curr-date").textContent = "Курс на " + d.date;
    } catch (e) {}
  };
  x1.onerror = function() {
    document.getElementById("curr-date").textContent = "Помилка завантаження курсу";
  };
  x1.send();

  var x2 = new XMLHttpRequest();
  x2.open("GET", "https://jsdelivr.net", true);
  x2.onload = function() {
    try {
      var d = JSON.parse(x2.responseText);
      document.getElementById("eur-sell").textContent = d.eur.uah.toFixed(2) + " ₴";
    } catch (e) {}
  };
  x2.send();
}

loadWeather();
loadRates();
setInterval(loadWeather, 1800000);
setInterval(loadRates, 1800000);
</script>
</body>
</html>
